name: macOS build

# Builds Sable for macOS on GitHub's own Macs (a Mac app can only be built on a Mac), checks that
# the result is a sound app, and starts it once to prove it runs. Run it by hand from the Actions
# tab ("Run workflow"), or let it run when a release is published: the disk images and zips are then
# added to that release (the in-app updater on a Mac reads the zip). Experimental: nobody has run
# these builds on a Mac of their own yet. With a tag, the tag's own commit is built (not the branch
# the run was started from) and the files are uploaded only when the tag still points there and
# package.json has the tag's version.
#
# The app is signed ad hoc ("-" in package.json > build > mac > identity): it runs, but macOS asks the
# person to allow it once (README, "Install"). With an Apple Developer ID, remove that line and add
# the CSC_LINK, CSC_KEY_PASSWORD and APPLE_* secrets; electron-builder then signs and notarizes.
#
# Least privilege: the build runs with a read-only token and no cache (nothing a build step could
# leave behind reaches a release); only the last job, which runs no code of the repository, may write
# to the release. Actions are pinned to full commit hashes (the tag in the comment).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the files to (empty: only keep them as a workflow artifact)'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # What is built: with a release tag (published, or given by hand), that tag's own commit, whatever
  # branch the run was started from; without one, the commit the run was started on (artifact only).
  # Resolved once, before anything is checked out, and checked again before the upload.
  target:
    name: What to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      sha: ${{ steps.t.outputs.sha }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release tag of this repository's form (v1.2.3), nothing that could read as an option or a path.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a release tag (v1.2.3)"; exit 1
          fi
          gh release view "$TAG" --json tagName > /dev/null
          SHA=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  mac:
    name: ${{ matrix.arch }}
    needs: target
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      # The source is the resolved commit, and for a release its version is the tag's.
      - name: Check the source
        env:
          SHA: ${{ needs.target.outputs.sha }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ] && [ "v$VERSION" != "$TAG" ]; then echo "::error::package.json says $VERSION, the release is $TAG"; exit 1; fi
          echo "built: $SHA ($VERSION)"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The Claude Code binary for this chip comes with the Agent SDK as an optional dependency of the
      # same chip (build-electron.mjs stages it), which is why each chip builds on its own runner.
      - run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm desktop:build

      - name: Package (disk image and zip)
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never --config.directories.output=release-mac

      - name: Check the app
        run: |
          set -euo pipefail
          APP="release-mac/mac-${{ matrix.arch }}/Sable.app"
          [ -d "$APP" ] || APP="release-mac/mac/Sable.app"
          echo "app: $APP"
          lipo -archs "$APP/Contents/MacOS/Sable"
          lipo -archs "$APP/Contents/Resources/claude/claude"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Identifier|Signature|flags|TeamIdentifier" || true
          codesign -d --entitlements - "$APP/Contents/Resources/claude/claude" 2>&1 | head -20 || true
          # The bundled agent has to run on its own.
          "$APP/Contents/Resources/claude/claude" --version
          echo "APP=$APP" >> "$GITHUB_ENV"

      # Starts the packaged app the way the repository's other checks do: demo agent, throwaway data
      # folders, one screenshot of the first screen, then it quits. A failure here is reported but
      # does not stop the files from being published (a runner may have no usable display).
      - name: Start the app once
        continue-on-error: true
        env:
          SABLE_DEMO: '1'
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/sable-home" "$RUNNER_TEMP/sable-user" shots
          export SABLE_HOME="$RUNNER_TEMP/sable-home" SABLE_USER_DATA="$RUNNER_TEMP/sable-user"
          "$APP/Contents/MacOS/Sable" --screenshot="$PWD/shots/first-screen-${{ matrix.arch }}.png" --wait=2500 2>&1 | tee shots/start-${{ matrix.arch }}.log
          ls -la shots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Sable-mac-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release-mac/*.dmg
            release-mac/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Sable-mac-${{ matrix.arch }}-first-screen
          if-no-files-found: ignore
          path: shots/

  attach:
    name: Attach to the release
    needs: [target, mac]
    if: needs.target.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Sable-mac-*
          path: files
          merge-multiple: true

      # Only files built from the tag's commit, of the tag's version, replace a release's downloads:
      # the tag must still point where it did when the build began, and every file must carry the version.
      - name: Upload the disk images and zips
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.target.outputs.tag }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          set -euo pipefail
          ls -la files
          NOW=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)
          [ "$NOW" = "$SHA" ] || { echo "::error::$TAG moved from $SHA to $NOW during the build"; exit 1; }
          VERSION="${TAG#v}"
          shopt -s nullglob
          FILES=(files/*.dmg files/*.zip)
          [ "${#FILES[@]}" -gt 0 ] || { echo "::error::no files to upload"; exit 1; }
          for f in "${FILES[@]}"; do
            case "$(basename "$f")" in *"-$VERSION-"*|*"-$VERSION."*) ;; *) echo "::error::$f is not of version $VERSION"; exit 1 ;; esac
          done
          gh release upload "$TAG" "${FILES[@]}" --clobber
